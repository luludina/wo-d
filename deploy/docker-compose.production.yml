name: egg-booking

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend

  mongodb-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -ec
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status()
          } catch (error) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })
          }
        '
    networks:
      - backend

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/egg_booking?replicaSet=rs0
      MONGO_DB_NAME: egg_booking
      AVATAR_UPLOAD_DIR: /data/avatars
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8090:3000
    volumes:
      - ./data/avatars:/data/avatars
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend
      - outbound

networks:
  backend:
    internal: true
  outbound:

volumes:
  mongodb-data:
